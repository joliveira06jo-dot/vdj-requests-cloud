<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pedidos VirtualDJ</title>
    <!-- Importação da Fonte Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #000; 
            color: white; 
            overscroll-behavior-y: none; 
        }
        input:focus { outline: none; }
    </style>
</head>
<body>
    <div id="app" :class="temaAtual === 'karaoke' ? 'bg-[url(/fundo-thevoice-app.png)]' : 'bg-[url(/fundo-app.png)]'" class="max-w-md mx-auto p-5 relative min-h-screen bg-cover bg-center bg-no-repeat bg-fixed transition-all duration-500 flex flex-col">
        
        <!-- TELA 1: CADASTRO -->
        <div v-if="telaAtual === 'cadastro'" class="flex flex-col items-center justify-center flex-1 py-8">
            <div class="mb-12 w-full flex justify-center">
                <img src="/logo-vdj.png" alt="VirtualDJ" class="w-3/4 max-w-[280px] object-contain">
            </div>

            <div class="bg-[#2a2a2a] rounded-[2.5rem] p-8 w-full shadow-2xl">
                <label class="block text-center text-[13px] font-medium text-white mb-3">INSIRA O SEU NOME</label>
                <input v-model="nome" type="text" class="w-full bg-white text-black px-6 py-4 rounded-full mb-8 text-center text-xl font-bold shadow-inner" placeholder="">

                <div class="border-t border-zinc-600/50 pt-8 mb-8 text-center">
                    <label class="block text-[13px] font-medium text-white mb-2">ESCOLHA UMA FOTO PARA<br>APARECER NO TELÃO</label>
                    <p class="text-[11px] text-zinc-400 mb-6 leading-tight font-light">*Opcional<br>Atenção: Se você não subir uma foto agora, saiba que não será possível carregar a foto depois.</p>
                    
                    <label class="inline-flex items-center justify-center w-32 h-32 bg-white text-black rounded-[2rem] cursor-pointer relative overflow-hidden transition-transform active:scale-95 shadow-lg">
                        <input type="file" class="hidden" @change="processarFoto" accept="image/*">
                        <img v-if="fotoPreview" :src="fotoPreview" class="absolute inset-0 w-full h-full object-cover">
                        <!-- Ícone de Upload customizado -->
                        <svg v-else class="w-16 h-16 text-zinc-800" fill="currentColor" viewBox="0 0 24 24"><path d="M19 13v5c0 .55-.45 1-1 1H6c-.55 0-1-.45-1-1v-5c0-.55-.45-1-1-1s-1 .45-1 1v6c0 1.65 1.35 3 3 3h14c1.65 0 3-1.35 3-3v-6c0-.55-.45-1-1-1s-1 .45-1 1zm-5.65-8.65l-2.65-2.65c-.2-.2-.51-.2-.71 0L7.35 4.35c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0L11 3.41V13c0 .55.45 1 1 1s1-.45 1-1V3.41l2.24 2.35c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41z"/></svg>
                        <div v-if="uploading" class="absolute inset-0 bg-black/70 flex items-center justify-center text-white text-sm font-bold">Enviando...</div>
                    </label>
                </div>

                <button @click="avancar" :disabled="!nome || uploading" class="w-full bg-[#e5e5e5] text-black font-extrabold text-xl py-4 rounded-full disabled:opacity-50 flex items-center justify-center gap-3 transition-transform active:scale-95">
                    AVANÇAR
                    <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </div>

        <!-- TELA 2: PRINCIPAL (PISTA) -->
        <div v-if="telaAtual === 'principal'" class="pb-8">
            <!-- Header -->
            <div class="flex justify-between items-center mb-8 pt-4">
                <div class="flex-1 flex justify-center pl-16">
                    <img src="/logo-vdj.png" alt="VirtualDJ" class="h-16 object-contain">
                </div>
                <img :src="fotoUrl || 'https://i.ibb.co/6H9nkWm/default-avatar.png'" @click="telaAtual = 'cadastro'" class="w-16 h-16 rounded-full object-cover border-2 border-zinc-700 cursor-pointer shadow-xl">
            </div>

            <!-- Botão CTA -->
            <button @click="abrirBusca" class="w-full bg-[#2a2a2a] text-white font-black text-2xl py-5 rounded-full mb-8 flex justify-between items-center px-8 shadow-xl transition-transform active:scale-95 border border-zinc-700/50">
                PEDIR MÚSICA
                <div class="bg-white rounded-full p-1.5 flex items-center justify-center text-black">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 12h14M12 5l7 7-7 7"></path></svg>
                </div>
            </button>

            <!-- Card Automix -->
            <div class="bg-[#2a2a2a] rounded-[2.5rem] p-6 w-full shadow-2xl">
                <div class="flex items-center justify-center gap-2 mb-4 text-sm font-bold text-white tracking-wide">
                    <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                    TOCANDO AGORA
                </div>
                
                <div class="w-full aspect-[21/9] bg-zinc-900 rounded-3xl mb-5 overflow-hidden shadow-inner">
                    <img v-if="tocandoAgora.capa" :src="tocandoAgora.capa" class="w-full h-full object-cover">
                </div>
                <div class="text-center mb-8 px-2">
                    <h2 class="text-3xl font-extrabold truncate text-white tracking-tight mb-1">{{ tocandoAgora.titulo }}</h2>
                    <p class="text-zinc-300 truncate text-[15px]">{{ tocandoAgora.artista }}</p>
                </div>

                <div class="border-t border-zinc-600/50 pt-6">
                    <h3 class="text-center font-bold text-xl mb-5 text-white">A seguir</h3>
                    
                    <div class="space-y-4 mb-8">
                        <div v-for="(musica, index) in proximasMusicas" :key="index" class="bg-[#e5e5e5] text-black rounded-3xl p-3 flex items-center gap-4">
                            <img :src="musica.capa" class="w-16 h-16 rounded-2xl object-cover shadow-md bg-zinc-300">
                            <div class="flex-1 min-w-0">
                                <h4 class="font-extrabold text-[16px] truncate leading-tight">{{ musica.titulo }}</h4>
                                <p class="text-[13px] text-zinc-700 truncate mt-0.5">{{ musica.artista }}</p>
                            </div>
                            <div class="text-center px-4 border-l border-zinc-400/50">
                                <p class="text-[10px] font-bold text-zinc-500 leading-none">posição</p>
                                <p class="font-black text-2xl leading-none my-1">{{ index + 2 }}</p>
                                <p class="text-[10px] font-bold text-zinc-500 leading-none">no deck do DJ</p>
                            </div>
                        </div>
                    </div>

                    <button @click="verProximas" class="w-full bg-black text-white font-extrabold text-xl py-4 rounded-full flex items-center justify-between px-8 transition-transform active:scale-95 shadow-lg">
                        VER PRÓXIMAS
                        <div class="bg-white rounded-full p-1 flex items-center justify-center text-black">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M9 5l7 7-7 7"></path></svg>
                        </div>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        
        const IMGBB_API_KEY = 'COLOQUE_A_SUA_CHAVE_AQUI'; 

        createApp({
            setup() {
                const telaAtual = ref('cadastro');
                const temaAtual = ref('pista'); 
                const nome = ref('');
                const fotoUrl = ref('');
                const fotoPreview = ref('');
                const uploading = ref(false);

                const tocandoAgora = ref({ titulo: 'Nem é Bom Lembrar', artista: 'Marília Mendonça', capa: 'https://i.ibb.co/xLqB8zP/placeholder-wide.jpg' });
                const proximasMusicas = ref([
                    { titulo: 'Primavera', artista: 'Jorge e Mateus', capa: 'https://i.ibb.co/30ZcM9G/placeholder-sq1.jpg' },
                    { titulo: 'Até Você Voltar', artista: 'Henrique e Juliano', capa: 'https://i.ibb.co/m0fT8h6/placeholder-sq2.jpg' }
                ]);

                onMounted(() => {
                    const savedName = localStorage.getItem('vdj_nome');
                    const savedFoto = localStorage.getItem('vdj_foto');
                    if (savedName) {
                        nome.value = savedName;
                        if (savedFoto) fotoUrl.value = savedFoto;
                        telaAtual.value = 'principal';
                    }
                });

                const processarFoto = async (event) => {
                    const file = event.target.files[0];
                    if (!file) return;

                    fotoPreview.value = URL.createObjectURL(file);
                    uploading.value = true;

                    const formData = new FormData();
                    formData.append('image', file);

                    try {
                        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                        const data = await res.json();
                        if (data.success) fotoUrl.value = data.data.url;
                    } catch (e) {
                        alert('Falha na conexão com o ImgBB.');
                        fotoPreview.value = '';
                    } finally {
                        uploading.value = false;
                    }
                };

                const avancar = () => {
                    localStorage.setItem('vdj_nome', nome.value);
                    if (fotoUrl.value) localStorage.setItem('vdj_foto', fotoUrl.value);
                    telaAtual.value = 'principal';
                };

                const abrirBusca = () => alert('Mock: Transição para Tela de Busca');
                const verProximas = () => alert('Mock: Transição para Fila Expandida');

                return {
                    telaAtual, temaAtual, nome, fotoUrl, fotoPreview, uploading, processarFoto, avancar,
                    tocandoAgora, proximasMusicas, abrirBusca, verProximas
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
