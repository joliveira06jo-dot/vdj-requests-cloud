<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pedidos VirtualDJ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        html, body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #000; 
            color: white; 
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            position: relative;
            min-height: 100vh;
        }
        input:focus { outline: none; }
        
        /* Fundo fixo universal blindado por CSS puro */
        .fundo-base {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -10;
        }
        .fundo-pista { background-image: url('fundo-app.png'); }
        .fundo-karaoke { background-image: url('fundo-thevoice-app.png'); }

        @keyframes pulseZoom {
            0% { transform: scale(1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
            50% { transform: scale(1.015); box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7); }
            100% { transform: scale(1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        }

        .btn-animado {
            animation: pulseZoom 4s infinite ease-in-out;
        }
    </style>
</head>
<body :class="temaAtual === 'karaoke' ? 'fundo-karaoke' : 'fundo-pista'" class="fundo-base overflow-y-auto">
    <div id="app" class="max-w-md mx-auto relative min-h-screen flex flex-col font-['Poppins'] pb-12">
        
        <!-- Camada escura opcional para contraste -->
        <div class="fixed inset-0 bg-black/15 -z-10 pointer-events-none"></div>

        <!-- TELA 1: CADASTRO -->
        <div v-if="telaAtual === 'cadastro'" class="flex flex-col w-full px-5 pt-6 pb-8">
            <div class="relative flex justify-center items-center mb-6 h-[75px] w-full shrink-0">
                <img src="logo-vdj.png" alt="VirtualDJ" class="w-[260px] object-contain drop-shadow-2xl">
            </div>

            <div class="bg-[#2d2d2d] rounded-[2.5rem] p-7 w-full shadow-2xl border border-white/10">
                <label class="block text-center text-[11px] font-semibold text-white mb-3 tracking-[0.15em]">INSIRA O SEU NOME</label>
                <input v-model="nome" type="text" class="w-full bg-white text-black px-6 py-4 rounded-full mb-8 text-center text-xl font-bold shadow-inner" placeholder="">

                <div class="w-full h-px bg-[#3d3d3d] mb-6"></div>

                <div class="text-center mb-8">
                    <label class="block text-[11px] font-semibold text-white mb-2 tracking-[0.1em] leading-relaxed">ESCOLHA UMA FOTO PARA<br>APARECER NO TELÃO</label>
                    <p class="text-[10px] text-[#aaaaaa] mb-6 leading-tight font-normal">*Opcional<br>Atenção: Se você não subir uma foto agora, saiba que não será possível carregar a foto depois.</p>
                    
                    <label class="inline-flex items-center justify-center w-[110px] h-[110px] bg-white text-black rounded-[2rem] cursor-pointer relative overflow-hidden transition-transform active:scale-95 shadow-lg">
                        <input type="file" class="hidden" @change="processarFoto" accept="image/*">
                        <img v-if="fotoPreview" :src="fotoPreview" class="absolute inset-0 w-full h-full object-cover">
                        <svg v-else class="w-10 h-10 text-black" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                        </svg>
                        <div v-if="uploading" class="absolute inset-0 bg-black/70 flex items-center justify-center text-white text-xs font-bold tracking-widest">ENVIANDO</div>
                    </label>
                </div>

                <button @click="avancar" :disabled="!nome || uploading" class="w-full bg-[#7a7a7a] text-black font-extrabold text-[19px] py-4 rounded-full disabled:opacity-50 flex items-center justify-center gap-3 transition-transform active:scale-95 shadow-md">
                    AVANÇAR
                    <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>

        <!-- TELA 2: PRINCIPAL (PISTA) -->
        <div v-if="telaAtual === 'principal'" class="flex flex-col flex-1 w-full px-5 pb-6 pt-6">
            <!-- Header Fixo Padronizado -->
            <div class="relative flex justify-center items-center mb-4 h-[75px] w-full shrink-0">
                <img src="logo-vdj.png" alt="VirtualDJ" class="w-[260px] object-contain drop-shadow-2xl">
                <img :src="fotoUrl || 'https://i.ibb.co/6H9nkWm/default-avatar.png'" @click="telaAtual = 'cadastro'" class="absolute right-0 w-[54px] h-[54px] rounded-full object-cover border-2 border-white/20 cursor-pointer shadow-xl self-center">
            </div>

            <!-- Botão CTA Pedir Música -->
            <button @click="abrirBusca" class="w-full bg-[#2d2d2d] text-white font-black text-[30px] tracking-tight py-4 rounded-full my-3 flex justify-between items-center pl-9 pr-3 shadow-2xl transition-transform active:scale-95 border border-white/15 btn-animado">
                PEDIR MÚSICA
                <div class="bg-white rounded-full w-12 h-12 flex items-center justify-center text-black shrink-0 shadow-md">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 12h14M12 5l7 7-7 7"></path></svg>
                </div>
            </button>

            <!-- Card Automix Principal -->
            <div class="bg-[#2d2d2d] rounded-[2.5rem] p-5 w-full shadow-2xl mb-4 border border-white/10">
                <div class="flex items-center justify-center gap-2 mb-3 text-[13px] font-extrabold text-white tracking-[0.2em]">
                    <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                    TOCANDO AGORA
                </div>
                
                <div class="w-full aspect-[21/9] bg-zinc-900 rounded-[1.5rem] mb-3 overflow-hidden shadow-inner">
                    <img v-if="tocandoAgora.capa" :src="tocandoAgora.capa" class="w-full h-full object-cover">
                </div>
                <div class="text-center mb-5 px-2">
                    <h2 class="text-2xl font-extrabold truncate text-white tracking-tight mb-0.5">{{ tocandoAgora.titulo }}</h2>
                    <p class="text-[#cccccc] truncate text-[14px]">{{ tocandoAgora.artista }}</p>
                </div>

                <div class="w-full h-px bg-[#3d3d3d] mb-4"></div>

                <div>
                    <h3 class="text-center font-bold text-[17px] mb-3 text-white tracking-wide">A seguir</h3>
                    
                    <!-- Fila de Espera -->
                    <div class="space-y-4 pt-1">
                        <div v-for="(musica, index) in proximasMusicas" :key="index" class="relative bg-[#ececec] text-black rounded-[1.25rem] py-2.5 pl-14 pr-3 flex items-center gap-3 shadow-md">
                            <img :src="musica.capa" class="absolute -left-2.5 w-16 h-16 rounded-xl object-cover shadow-xl bg-zinc-300 shrink-0 border-2 border-white">
                            
                            <div class="flex-1 min-w-0 pl-3">
                                <h4 class="font-extrabold text-[15px] truncate leading-tight text-black">{{ musica.titulo }}</h4>
                                <p class="text-[12px] text-[#555555] truncate mt-0.5">{{ musica.artista }}</p>
                            </div>

                            <div class="text-center px-3 border-l border-[#cccccc] shrink-0">
                                <p class="text-[8px] font-bold text-gray-500 leading-none uppercase tracking-wider">posição</p>
                                <p class="font-black text-[20px] leading-none my-0.5 text-black">{{ index + 2 }}</p>
                                <p class="text-[8px] font-bold text-gray-500 leading-none uppercase tracking-wider">no deck</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botão Independente no Rodapé ("Ver Próximas") -->
            <button @click="verProximas" class="w-full bg-[#120a10] text-white font-extrabold text-[17px] py-3 px-6 rounded-full flex items-center justify-between shadow-2xl transition-transform active:scale-95 border border-white/10">
                VER PRÓXIMAS
                <div class="bg-white rounded-full w-9 h-9 flex items-center justify-center text-black shrink-0 shadow-md">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M9 5l7 7-7 7"></path></svg>
                </div>
            </button>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        
        const IMGBB_API_KEY = 'COLOQUE_A_SUA_CHAVE_AQUI'; 

        createApp({
            setup() {
                const telaAtual = ref('cadastro');
                const temaAtual = ref('pista'); 
                const nome = ref('');
                const fotoUrl = ref('');
                const fotoPreview = ref('');
                const uploading = ref(false);

                const tocandoAgora = ref({ titulo: 'Nem é Bom Lembrar', artista: 'Marília Mendonça', capa: 'https://i.ibb.co/xLqB8zP/placeholder-wide.jpg' });
                const proximasMusicas = ref([
                    { titulo: 'Primavera', artista: 'Jorge e Mateus', capa: 'https://i.ibb.co/30ZcM9G/placeholder-sq1.jpg' },
                    { titulo: 'Até Você Voltar', artista: 'Henrique e Juliano', capa: 'https://i.ibb.co/m0fT8h6/placeholder-sq2.jpg' }
                ]);

                onMounted(() => {
                    const savedName = localStorage.getItem('vdj_nome');
                    const savedFoto = localStorage.getItem('vdj_foto');
                    if (savedName) {
                        nome.value = savedName;
                        if (savedFoto) fotoUrl.value = savedFoto;
                        telaAtual.value = 'principal';
                    }
                });

                const processarFoto = async (event) => {
                    const file = event.target.files[0];
                    if (!file) return;

                    fotoPreview.value = URL.createObjectURL(file);
                    uploading.value = true;

                    const formData = new FormData();
                    formData.append('image', file);

                    try {
                        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                        const data = await res.json();
                        if (data.success) fotoUrl.value = data.data.url;
                    } catch (e) {
                        alert('Falha na conexão com o ImgBB.');
                        fotoPreview.value = '';
                    } finally {
                        uploading.value = false;
                    }
                };

                const avancar = () => {
                    localStorage.setItem('vdj_nome', nome.value);
                    if (fotoUrl.value) localStorage.setItem('vdj_foto', fotoUrl.value);
                    telaAtual.value = 'principal';
                };

                const abrirBusca = () => alert('Mock: Transição para Tela de Busca');
                const verProximas = () => alert('Mock: Transição para Fila Expandida');

                return {
                    telaAtual, temaAtual, nome, fotoUrl, fotoPreview, uploading, processarFoto, avancar,
                    tocandoAgora, proximasMusicas, abrirBusca, verProximas
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
