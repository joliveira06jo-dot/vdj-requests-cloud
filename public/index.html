<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos de Música</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; margin: 0; padding: 20px; text-align: center; }
        .hidden { display: none !important; }
        .tab-btn { background: #333; color: white; padding: 10px; border: none; cursor: pointer; width: 48%; }
        .tab-btn.active { background: #e63946; font-weight: bold; }
        .card { background: #222; padding: 15px; margin: 10px 0; border-radius: 8px; text-align: left; border-left: 4px solid #e63946; }
        input, button { padding: 12px; margin-top: 10px; width: 100%; box-sizing: border-box; border-radius: 5px; border: none; }
        button { background: #e63946; color: white; font-weight: bold; cursor: pointer; }
        .dj-virtual-msg { color: #a8dadc; font-style: italic; font-size: 0.9em; margin-bottom: 15px; }
        .item-catalogo { background: #222; padding: 10px; margin: 5px 0; border-radius: 5px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .item-catalogo button { width: auto; padding: 6px 12px; margin: 0; background: #4ade80; color: #000; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Bem-vindo à Pista!</h2>
        <p class="dj-virtual-msg">🤖 DJ Virtual: Identifique-se para acessar a pista.</p>
        <input type="text" id="nome-usuario" placeholder="Digite seu Nome ou Apelido">
        <button onclick="entrarNaFesta()">Entrar na Festa</button>
    </div>

    <div id="app-screen" class="hidden">
        <h3 id="saudacao"></h3>
        
        <div>
            <button class="tab-btn active" id="btn-tab-pedir" onclick="mudarAba('pedir')">Pedir Música</button>
            <button class="tab-btn" id="btn-tab-fila" onclick="mudarAba('fila')">Fila / Já Rolou</button>
        </div>

        <div id="aba-pedir" style="margin-top: 20px;">
            <p class="dj-virtual-msg">Pesquise no catálogo oficial do DJ:</p>
            <input type="text" id="busca-musica" placeholder="Digite o artista ou música..." onkeyup="filtrarCatalogo()">
            <div id="lista-catalogo" style="max-height: 350px; overflow-y: auto; margin-top: 10px;">
                <p style="color:#666;">Carregando catálogo...</p>
            </div>
            <button style="background: #444; margin-top:20px;" onclick="mostrarModalNaoEncontrei()">Não encontrei minha música</button>
        </div>

        <div id="aba-fila" class="hidden" style="margin-top: 20px;">
            <h4>Fila Ao Vivo</h4>
            <div id="lista-fila">Nenhuma música na fila ainda.</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let meuNome = localStorage.getItem('vdj_nome');
        let catalogoGlobal = [];

        if (meuNome) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('saudacao').innerText = `E aí, ${meuNome}!`;
        }

        function entrarNaFesta() {
            const nomeInput = document.getElementById('nome-usuario').value.trim();
            if (nomeInput.length > 2) {
                localStorage.setItem('vdj_nome', nomeInput);
                location.reload();
            } else {
                alert("Digite um nome válido!");
            }
        }

        function mudarAba(aba) {
            if (aba === 'pedir') {
                document.getElementById('aba-pedir').classList.remove('hidden');
                document.getElementById('aba-fila').classList.add('hidden');
                document.getElementById('btn-tab-pedir').classList.add('active');
                document.getElementById('btn-tab-fila').classList.remove('active');
            } else {
                document.getElementById('aba-pedir').classList.add('hidden');
                document.getElementById('aba-fila').classList.remove('hidden');
                document.getElementById('btn-tab-pedir').classList.remove('active');
                document.getElementById('btn-tab-fila').classList.add('active');
            }
        }

        function mostrarModalNaoEncontrei() {
            alert("🤖 DJ Virtual: Nosso catálogo é rigorosamente selecionado! Se não achou sua faixa, procure o DJ pessoalmente na cabine.");
        }

        socket.on('update_biblioteca', (catalogo) => {
            catalogoGlobal = catalogo;
            renderizarCatalogo(catalogo);
        });

        function renderizarCatalogo(lista) {
            const div = document.getElementById('lista-catalogo');
            div.innerHTML = '';
            if (lista.length === 0) {
                div.innerHTML = '<p style="color:#666;">Nenhuma música encontrada.</p>';
                return;
            }
            lista.forEach((item, idx) => {
                div.innerHTML += `
                    <div class="item-catalogo">
                        <div>
                            <strong>${item.musica}</strong><br>
                            <small style="color:#aaa;">${item.artista}</small>
                        </div>
                        <button onclick="enviarPedido('${item.artista}', '${item.musica}')">Pedir</button>
                    </div>
                `;
            });
        }

        function filtrarCatalogo() {
            const termo = document.getElementById('busca-musica').value.toLowerCase();
            const filtrado = catalogoGlobal.filter(item => 
                item.musica.toLowerCase().includes(termo) || item.artista.toLowerCase().includes(termo)
            );
            renderizarCatalogo(filtrado);
        }

        function enviarPedido(artista, musica) {
            const pedido = {
                nome: meuNome,
                artista: artista,
                musica: musica,
                tipo: 'pista',
                hora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            socket.emit('novo_pedido', pedido);
            alert(`🤖 DJ Virtual: Pedido de "${musica}" enviado com sucesso para a fila!`);
            mudarAba('fila');
        }

        socket.on('erro_pedido', (msg) => {
            alert("⚠️ " + msg);
        });

        socket.on('sync_state', (estado) => {
            const divFila = document.getElementById('lista-fila');
            divFila.innerHTML = '';
            if (estado.filaPista.length === 0) {
                divFila.innerHTML = '<p style="color:#666;">Fila vazia.</p>';
                return;
            }
            estado.filaPista.forEach((pedido, index) => {
                let etaMsg = index === 0 ? "Próxima a tocar" : `~${index * 3} minutos`;
                divFila.innerHTML += `
                    <div class="card">
                        <strong>${pedido.musica}</strong><br>
                        <small>Artista: ${pedido.artista} | Pedido por: ${pedido.nome} | ⏳ ${etaMsg}</small>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
