<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pedidos VirtualDJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #000; color: white; overscroll-behavior-y: none; }
        input:focus { outline: none; }
    </style>
</head>
<body>
    <!-- O Vue controla o fundo da tela inteira dinamicamente -->
    <div id="app" :class="temaAtual === 'karaoke' ? 'bg-[url(/fundo-thevoice-app.png)]' : 'bg-[url(/fundo-app.png)]'" class="max-w-md mx-auto p-5 relative min-h-screen bg-cover bg-center bg-no-repeat bg-fixed transition-all duration-500">
        
        <!-- TELA 1: CADASTRO -->
        <div v-if="telaAtual === 'cadastro'" class="flex flex-col items-center justify-center pt-8 pb-10 h-full">
            <div class="mb-10 text-center flex flex-col items-center">
                <img src="/logo-vdj.png" alt="VirtualDJ" class="h-16 object-contain mb-2">
            </div>

            <div class="bg-[#18181b] rounded-[2rem] p-7 w-full shadow-2xl">
                <label class="block text-center text-sm font-bold text-zinc-300 mb-3 tracking-wide">INSIRA O SEU NOME</label>
                <input v-model="nome" type="text" class="w-full bg-white text-black px-4 py-4 rounded-xl mb-8 text-center text-xl font-bold" placeholder="">

                <div class="border-t border-zinc-700 pt-6 mb-6 text-center">
                    <label class="block text-sm font-bold text-zinc-300 mb-1 tracking-wide">ESCOLHA UMA FOTO PARA<br>APARECER NO TELÃO</label>
                    <p class="text-[11px] text-zinc-500 mb-5 leading-tight mt-2">*Opcional<br>Atenção: Se você não subir uma foto agora, saiba que não será possível carregar a foto depois.</p>
                    
                    <label class="inline-flex items-center justify-center w-28 h-28 bg-white text-black rounded-2xl cursor-pointer relative overflow-hidden transition-transform active:scale-95 shadow-lg">
                        <input type="file" class="hidden" @change="processarFoto" accept="image/*">
                        <img v-if="fotoPreview" :src="fotoPreview" class="absolute inset-0 w-full h-full object-cover">
                        <svg v-else class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <div v-if="uploading" class="absolute inset-0 bg-black/60 flex items-center justify-center text-white text-xs font-bold">Enviando...</div>
                    </label>
                </div>

                <button @click="avancar" :disabled="!nome || uploading" class="w-full bg-zinc-200 text-black font-extrabold text-lg py-4 rounded-[1.5rem] mt-2 disabled:opacity-30 flex items-center justify-center gap-2 transition-transform active:scale-95">
                    AVANÇAR
                    <svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>

        <!-- TELA 2: PRINCIPAL (PISTA) -->
        <div v-if="telaAtual === 'principal'" class="pb-6">
            <!-- Header -->
            <div class="flex justify-between items-center mb-8 pt-2">
                <div class="flex-1 flex justify-center pl-12">
                    <img src="/logo-vdj.png" alt="VirtualDJ" class="h-10 object-contain">
                </div>
                <img :src="fotoUrl || 'https://i.ibb.co/6H9nkWm/default-avatar.png'" @click="telaAtual = 'cadastro'" class="w-14 h-14 rounded-full object-cover border-2 border-zinc-600 cursor-pointer shadow-lg">
            </div>

            <!-- Botão CTA -->
            <button @click="abrirBusca" class="w-full bg-zinc-100 text-black font-extrabold text-2xl py-4 rounded-[2.5rem] mb-6 flex justify-between items-center px-8 shadow-lg transition-transform active:scale-95">
                PEDIR MÚSICA
                <svg class="w-8 h-8 bg-black text-white rounded-full p-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M9 5l7 7-7 7"></path></svg>
            </button>

            <!-- Card Automix -->
            <div class="bg-[#18181b] rounded-[2rem] p-5 w-full shadow-2xl">
                <div class="flex items-center justify-center gap-2 mb-4 text-sm font-bold text-zinc-300 tracking-wide">
                    <svg class="w-5 h-5 text-zinc-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                    TOCANDO AGORA
                </div>
                
                <div class="w-full aspect-[21/9] bg-zinc-800 rounded-2xl mb-4 overflow-hidden shadow-inner">
                    <img v-if="tocandoAgora.capa" :src="tocandoAgora.capa" class="w-full h-full object-cover">
                </div>
                <div class="text-center mb-6 px-2">
                    <h2 class="text-2xl font-extrabold truncate text-white tracking-tight">{{ tocandoAgora.titulo }}</h2>
                    <p class="text-zinc-400 truncate text-sm mt-1">{{ tocandoAgora.artista }}</p>
                </div>

                <div class="border-t border-zinc-700 pt-5">
                    <h3 class="text-center font-bold text-xl mb-4 tracking-tight">A seguir</h3>
                    
                    <div class="space-y-3 mb-6">
                        <div v-for="(musica, index) in proximasMusicas" :key="index" class="bg-[#e4e4e7] text-black rounded-[1.5rem] p-3 flex items-center gap-3">
                            <img :src="musica.capa" class="w-16 h-16 rounded-xl object-cover shadow-sm bg-zinc-300">
                            <div class="flex-1 min-w-0">
                                <h4 class="font-extrabold text-[15px] truncate tracking-tight">{{ musica.titulo }}</h4>
                                <p class="text-xs text-zinc-600 truncate mt-0.5">{{ musica.artista }}</p>
                            </div>
                            <div class="text-center px-3 border-l border-zinc-300">
                                <p class="text-[9px] font-bold text-zinc-500 leading-none">posição</p>
                                <p class="font-black text-2xl leading-none my-0.5">{{ index + 2 }}</p>
                                <p class="text-[9px] font-bold text-zinc-500 leading-none">no deck do DJ</p>
                            </div>
                        </div>
                    </div>

                    <button @click="verProximas" class="w-full bg-[#09090b] border border-zinc-800 text-white font-extrabold text-lg py-3.5 rounded-[2rem] flex items-center justify-between px-6 transition-transform active:scale-95 shadow-md">
                        VER PRÓXIMAS
                        <svg class="w-7 h-7 bg-white text-black rounded-full p-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        
        const IMGBB_API_KEY = 'COLOQUE_A_SUA_CHAVE_AQUI'; 

        createApp({
            setup() {
                const telaAtual = ref('cadastro');
                const temaAtual = ref('pista'); // Controla o fundo
                const nome = ref('');
                const fotoUrl = ref('');
                const fotoPreview = ref('');
                const uploading = ref(false);

                const tocandoAgora = ref({ titulo: 'Nem é Bom Lembrar', artista: 'Marília Mendonça', capa: 'https://i.ibb.co/xLqB8zP/placeholder-wide.jpg' });
                const proximasMusicas = ref([
                    { titulo: 'Primavera', artista: 'Jorge e Mateus', capa: 'https://i.ibb.co/30ZcM9G/placeholder-sq1.jpg' },
                    { titulo: 'Até Você Voltar', artista: 'Henrique e Juliano', capa: 'https://i.ibb.co/m0fT8h6/placeholder-sq2.jpg' }
                ]);

                onMounted(() => {
                    const savedName = localStorage.getItem('vdj_nome');
                    const savedFoto = localStorage.getItem('vdj_foto');
                    if (savedName) {
                        nome.value = savedName;
                        if (savedFoto) fotoUrl.value = savedFoto;
                        telaAtual.value = 'principal';
                    }
                });

                const processarFoto = async (event) => {
                    const file = event.target.files[0];
                    if (!file) return;

                    fotoPreview.value = URL.createObjectURL(file);
                    uploading.value = true;

                    const formData = new FormData();
                    formData.append('image', file);

                    try {
                        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                        const data = await res.json();
                        if (data.success) fotoUrl.value = data.data.url;
                    } catch (e) {
                        alert('Falha na conexão com o ImgBB.');
                        fotoPreview.value = '';
                    } finally {
                        uploading.value = false;
                    }
                };

                const avancar = () => {
                    localStorage.setItem('vdj_nome', nome.value);
                    if (fotoUrl.value) localStorage.setItem('vdj_foto', fotoUrl.value);
                    telaAtual.value = 'principal';
                };

                const abrirBusca = () => {
                    // Para testar a troca de fundo futuramente:
                    // temaAtual.value = 'karaoke';
                    alert('Mock: Transição para Tela de Busca');
                };
                const verProximas = () => alert('Mock: Transição para Fila Expandida');

                return {
                    telaAtual, temaAtual, nome, fotoUrl, fotoPreview, uploading, processarFoto, avancar,
                    tocandoAgora, proximasMusicas, abrirBusca, verProximas
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
